title: LSE (MY202)
author: Jonas Weinert
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, lse.scss, layout-helpers.scss, components.scss]
      include-after-body: [timer.html, walk.html]
      template-partials:
        - title-slide.html
      transition: none
      background-transition: none
      slide-transition: none
      auto-animate: false
      fragments: false
      slide-number: c/t
      chalkboard: false
      preview-links: auto
      width: 1200
      height: 675
      margin: 0.08
      center: false
      navigation-mode: linear
      controls-tutorial: false
      code-line-numbers: false
      fig-align: center
      fig-width: 8
      fig-height: 4.2
    # Self-paced lab guides (format: lse-html). Components in guide.html, styles in guide.scss.
    html:
      theme: [cosmo, guide.scss]
      include-after-body: [guide.html]
      toc: true
      toc-location: left
      toc-depth: 3
      toc-title: "Lab guide"
      df-print: paged
      code-copy: true
      highlight-style: github
      embed-resources: true
      section-divs: true
      fig-align: center
